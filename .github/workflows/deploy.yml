name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it — a half-applied
# Pages deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22+ is the real floor: the QA runners drive Chrome over CDP using
      # the global WebSocket, which landed in 22. (The old reason — ESM syntax
      # detection for the .js registry — went away when package.json declared
      # "type": "module".)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check loader registry invariants
        run: npm run lint:registry

      - name: Build
        run: npm run build

      # Against the built artifact, not the source, so what ships is what is
      # tested. Uses the Chrome the runner image already provides.
      - name: Check every snippet still pastes and animates
        run: node qa/run-smoke-ci.mjs --root dist

      # The product is the snippet text, so bundling must not alter a single
      # byte of it. Compares every loader's snippet from source against the
      # same snippet produced by the minified bundle.
      - name: Check the build did not change any snippet
        run: node qa/verify-snippet-parity.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
